name: Fetch face models

# One-off helper: downloads the OpenCV Zoo ONNX models and commits them to models/.
on:
  push:
    branches: [deploy]
    paths: [models/README.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download models
        run: |
          base=https://github.com/opencv/opencv_zoo/raw/main/models
          curl -fsSL -o models/face_detection_yunet_2023mar.onnx  $base/face_detection_yunet/face_detection_yunet_2023mar.onnx
          curl -fsSL -o models/face_recognition_sface_2021dec.onnx $base/face_recognition_sface/face_recognition_sface_2021dec.onnx
          ls -la models
          python3 -c "import sys; [sys.exit(f+' is not an ONNX file') for f in ['models/face_detection_yunet_2023mar.onnx','models/face_recognition_sface_2021dec.onnx'] if open(f,'rb').read(2)==b've']"
      - name: Commit models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/*.onnx
          git diff --cached --quiet || git commit -m "Add OpenCV Zoo face models (YuNet, SFace)"
          git push
