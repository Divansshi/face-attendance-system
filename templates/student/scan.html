<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan — AttendAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <nav class="navbar">
    <a href="/student/scan" class="nav-brand">AttendAI</a>
    <div class="nav-links">
      <a href="/student/scan" class="nav-link active">Scan</a>
      <a href="/student/record" class="nav-link">My attendance</a>
    </div>
    <div class="nav-profile">
      <button class="profile-btn" onclick="toggleDropdown()">
        {{ name[0].upper() }}
      </button>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="profile-info">
          <div class="profile-name">{{ name }}</div>
        </div>
        <a href="/student/logout" class="dropdown-item danger">Sign out</a>
      </div>
    </div>
  </nav>

  <div class="scan-wrapper page-top">
    <h2>Mark your attendance</h2>
    <p class="subtitle">Position your face inside the frame and click Scan</p>

    <div class="camera-box" id="cameraBox">
      <img id="cameraFeed"
           style="width:100%; height:100%; object-fit:cover; border-radius:12px; display:none;" />
      <div class="camera-placeholder" id="cameraPlaceholder">Click Start camera to begin</div>
      <div class="bracket bracket-tl"></div>
      <div class="bracket bracket-tr"></div>
      <div class="bracket bracket-bl"></div>
      <div class="bracket bracket-br"></div>
      <div class="scan-status" id="scanStatus">Ready</div>
    </div>

    <button onclick="startCamera()" class="btn btn-primary" style="width:100%;">
      Start camera
    </button>
    <button onclick="scanFace()" class="btn btn-outline" style="width:100%; margin-top:0.75rem;">
      Scan my face
    </button>

    <!-- Block banner — hidden by default -->
    <div id="blockBanner" style="display:none; margin-top:1rem;
         background:#FAEEDA; border-radius:var(--radius-sm);
         padding:16px 20px; text-align:center;">
      <div style="font-size:22px; margin-bottom:6px;">⏱</div>
      <div style="font-size:15px; font-weight:500; color:#854F0B;" id="blockTitle">
        Attendance not open yet
      </div>
      <div style="font-size:13px; color:#BA7517; margin-top:4px;" id="blockMessage">
        Check back closer to your class time
      </div>
    </div>

    <!-- Match/error result -->
    <div id="scanResult" style="margin-top:1rem; display:none;"></div>

    <div style="margin-top:1rem; text-align:center;">
      <a href="/student/record" style="font-size:13px; color:var(--gray-500);">
        View my attendance record →
      </a>
    </div>
  </div>

  <script>
    let feedInterval = null;

    function toggleDropdown() {
      document.getElementById('profileDropdown').classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.nav-profile')) {
        document.getElementById('profileDropdown').classList.remove('open');
      }
    });

    async function startCamera() {
      document.getElementById('scanStatus').textContent = 'Starting…';
      document.getElementById('cameraPlaceholder').textContent = 'Warming up…';
      await fetch('/camera/start');
      await new Promise(resolve => setTimeout(resolve, 2500));
      document.getElementById('cameraPlaceholder').style.display = 'none';
      document.getElementById('cameraFeed').style.display = 'block';
      feedInterval = setInterval(updateFeed, 200);
      document.getElementById('scanStatus').textContent = 'Camera active';
    }

    async function updateFeed() {
      try {
        const res = await fetch('/camera/feed');
        if (!res.ok) return;
        const data = await res.json();
        if (data.frame) {
          document.getElementById('cameraFeed').src = 'data:image/jpeg;base64,' + data.frame;
        }
      } catch(e) {}
    }

    async function scanFace() {
      // Reset previous results
      document.getElementById('blockBanner').style.display = 'none';
      document.getElementById('scanResult').style.display = 'none';
      document.getElementById('scanStatus').textContent = 'Checking…';

      const res = await fetch('/student/scan/recognize', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'}
      });
      const data = await res.json();

      if (data.status === 'match') {
        document.getElementById('scanStatus').textContent = 'Matched!';
        clearInterval(feedInterval);
        window.location.href = '/student/success';

      } else if (data.status === 'no_match') {
        document.getElementById('scanStatus').textContent = 'Try again';
        const resultDiv = document.getElementById('scanResult');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
          <div style="background:var(--red-soft); color:var(--red-text);
               padding:12px 16px; border-radius:var(--radius-sm); font-size:14px;
               text-align:center;">
            ✕ Face not recognised — adjust lighting and try again
          </div>`;

      } else {
        // Blocked — time window, already marked, or no photo
        document.getElementById('scanStatus').textContent = 'Blocked';
        const msg = data.message || 'Scanning not available right now';
        const banner = document.getElementById('blockBanner');
        banner.style.display = 'block';

        if (msg.includes('opens in')) {
          document.getElementById('blockTitle').textContent = 'Attendance not open yet';
          document.getElementById('blockMessage').textContent = msg;
        } else if (msg.includes('closed')) {
          document.getElementById('blockTitle').textContent = 'Attendance window closed';
          document.getElementById('blockMessage').textContent = msg;
          banner.style.background = '#FAECE7';
          banner.querySelector('#blockTitle').style.color = '#993C1D';
          banner.querySelector('#blockMessage').style.color = '#D85A30';
        } else if (msg.includes('already marked')) {
          document.getElementById('blockTitle').textContent = 'Already marked today';
          document.getElementById('blockMessage').textContent = 'Your attendance has been recorded for this class.';
          banner.style.background = 'var(--teal-light)';
          banner.querySelector('#blockTitle').style.color = 'var(--teal-dark)';
          banner.querySelector('#blockMessage').style.color = 'var(--teal)';
        } else {
          document.getElementById('blockTitle').textContent = 'Cannot scan right now';
          document.getElementById('blockMessage').textContent = msg;
        }
      }
    }
  </script>

</body>
</html>
