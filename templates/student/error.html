<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recognition Failed — AttendAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <div class="card">
    <div class="error-banner">
      <div class="icon-circle">✕</div>
      <h1>Face not recognised</h1>
      <p>We couldn't verify your identity</p>
    </div>

    <p class="tips-label">Try these fixes</p>

    <div class="tip">
      <div class="tip-dot"></div>
      <span>Make sure your face is well lit — avoid sitting with a bright window behind you</span>
    </div>
    <div class="tip">
      <div class="tip-dot"></div>
      <span>Remove glasses or a hat if you're wearing one</span>
    </div>
    <div class="tip">
      <div class="tip-dot"></div>
      <span>Look directly at the camera and hold still</span>
    </div>

    <a href="/student/scan" class="btn btn-primary" style="margin-top: 1.5rem;">Try again</a>
    <a href="/student/login" class="btn btn-outline" style="margin-top: 0.75rem;">Back to login</a>
  </div>

</body>
</html>
