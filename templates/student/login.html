<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login — AttendAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <div class="card">
    <div class="auth-logo">AttendAI</div>
    <span class="role-badge">Student</span>
    <h1>Welcome</h1>
    <p class="subtitle">Sign in to mark your attendance</p>

    <label for="student-id">Student ID</label>
    <input type="text" id="student-id" placeholder="e.g. 2021234567" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" />

    <a href="/student/scan" class="btn btn-primary">Sign in</a>
  </div>

</body>
</html>
