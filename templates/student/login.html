<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login — AttendAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <div class="card">
    <div class="auth-logo">AttendAI</div>
    <span class="role-badge">Student</span>
    <h1>Welcome</h1>
    <p class="subtitle">Sign in to mark your attendance</p>

    {% if demo_mode %}
    <div class="demo-note">
      Enroll yourself first from the lecturer portal, then sign in here with the student ID you used.
    </div>
    {% endif %}

    {% if error %}<p class="error-text">{{ error }}</p>{% endif %}

    <form method="post" action="{{ url_for('student_login') }}">
      <label for="student-id">Student ID</label>
      <input type="text" id="student-id" name="student_id" placeholder="e.g. 2021234567" required />

      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>

    <p style="font-size:13px; margin-top:1rem; text-align:center;"><a href="/">← Back</a></p>
  </div>

</body>
</html>
