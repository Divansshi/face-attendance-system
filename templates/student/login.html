<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login — AttendAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <div class="card">
    <div class="auth-logo">AttendAI</div>
    <span class="role-badge">Student</span>
    <h1>Welcome</h1>
    <p class="subtitle">Sign in to mark your attendance</p>

    <form method="post" action="{{ url_for('student_login') }}">
      <label for="student-id">Student ID</label>
      <input type="text" id="student-id" name="student_id" placeholder="e.g. 2021234567" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required />

      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </div>

</body>
</html>
