<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lecturer Login — AttendAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <div class="card">
    <div class="auth-logo">AttendAI</div>
    <span class="role-badge">Lecturer</span>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to manage your classes</p>

    {% if demo_mode %}
    <div class="demo-note">
      Demo login: <code>{{ demo_email }}</code> / <code>{{ demo_password }}</code>
    </div>
    {% endif %}

    {% if error %}<p class="error-text">{{ error }}</p>{% endif %}

    <form method="post" action="{{ url_for('lecturer_login') }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@university.edu" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required />

      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>

    <p style="font-size:13px; margin-top:1rem; text-align:center;"><a href="/">← Back</a></p>
  </div>

</body>
</html>
