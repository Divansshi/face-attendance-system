<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enroll Student — AttendAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <nav class="navbar">
    <a href="/lecturer/dashboard" class="nav-brand">AttendAI</a>
    <div class="nav-links">
      <a href="/lecturer/dashboard" class="nav-link">Dashboard</a>
      <a href="/lecturer/enroll" class="nav-link active">Enroll</a>
      <a href="/lecturer/recognition" class="nav-link">Capture</a>
      <a href="/lecturer/audit" class="nav-link">Audit</a>
      <a href="/lecturer/classes" class="nav-link">Classes</a>
    </div>
    <div class="nav-profile">
      <button class="profile-btn" onclick="toggleDropdown()">DA</button>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="profile-info">
          <div class="profile-name">Dr. Amirah</div>
          <div class="profile-email">amirah@university.edu</div>
        </div>
        <a href="/lecturer/logout" class="dropdown-item danger">Sign out</a>
      </div>
    </div>
  </nav>

  <div class="page-wrapper page-top">

    <div class="page-header">
      <a href="/lecturer/dashboard" class="back-link">← Back</a>
      <h2>Enroll student</h2>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="warning-banner" style="margin-bottom:1rem;">
          <span class="warning-icon">⚠</span>
          <span>{{ messages[0] }}</span>
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="/lecturer/enroll" enctype="multipart/form-data">
      <div class="section-card">
        <p class="section-label">Student details</p>
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Ahmad Faris" required />
        <label for="sid">Student ID</label>
        <input type="text" id="sid" name="sid" placeholder="e.g. 2021234567" required />
        <label for="course">Course code</label>
        <input type="text" id="course" name="course" placeholder="e.g. CS301" required />
      </div>

      <div class="section-card">
        <p class="section-label">Face photo</p>
        <input type="file" name="photo" accept="image/*" style="font-size:14px;" />
        <p style="font-size:12px; color:var(--gray-500); margin-top:8px;">
          Clear front-facing photo · JPG or PNG
        </p>
      </div>

      <button type="submit" class="btn btn-primary">Enroll student</button>
    </form>

  </div>

  <script>
    function toggleDropdown() {
      document.getElementById('profileDropdown').classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.nav-profile')) {
        document.getElementById('profileDropdown').classList.remove('open');
      }
    });
  </script>

</body>
</html>
