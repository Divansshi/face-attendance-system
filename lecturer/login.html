<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lecturer Login — Attendance System</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <div class="card">
    <span class="role-badge">Lecturer</span>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to manage your classes</p>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@university.edu" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" />

    <a href="dashboard.html" class="btn btn-primary">Sign in</a>
  </div>

</body>
</html>
