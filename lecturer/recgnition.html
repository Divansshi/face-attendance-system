<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Recognition — Attendance System</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <div class="recognition-grid">

    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="margin-bottom:0;">CS301 — Live session</h2>
      <span class="live-badge">
        <span class="live-dot"></span>
        Live
      </span>
    </div>

    <!-- Camera feed -->
    <div class="camera-box">
      <div class="camera-placeholder">Camera feed will appear here</div>
      <div class="bracket bracket-tl"></div>
      <div class="bracket bracket-tr"></div>
      <div class="bracket bracket-bl"></div>
      <div class="bracket bracket-br"></div>
      <div class="scan-status">Scanning…</div>
    </div>

    <!-- Detected students -->
    <div class="section-card" style="padding: 0; overflow:hidden;">
      <div style="padding: 12px 16px; border-bottom: 1px solid var(--gray-100);">
        <p class="section-label" style="margin-bottom:0;">Marked present today</p>
      </div>

      <div class="detect-row">
        <div class="avatar">AF</div>
        <div class="detect-name">Ahmad Faris</div>
        <div class="detect-time">10:02 AM</div>
        <span class="badge-present">Present</span>
      </div>
      <div class="detect-row">
        <div class="avatar">SL</div>
        <div class="detect-name">Siti Liyana</div>
        <div class="detect-time">10:04 AM</div>
        <span class="badge-present">Present</span>
      </div>
      <div class="detect-row">
        <div class="avatar">RK</div>
        <div class="detect-name">Rajan Kumar</div>
        <div class="detect-time">10:05 AM</div>
        <span class="badge-present">Present</span>
      </div>
      <div class="detect-row">
        <div class="avatar" style="background:var(--gray-100); color:var(--gray-500);">NZ</div>
        <div class="detect-name" style="color:var(--gray-500);">Nur Zara</div>
        <div class="detect-time">—</div>
        <span class="badge-absent">Absent</span>
      </div>

    </div>

    <a href="dashboard.html" class="btn btn-outline">← Back to dashboard</a>

  </div>

</body>
</html>
