<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enroll Student — Attendance System</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <div class="page-wrapper">

    <div class="page-header">
      <a href="dashboard.html" class="back-link">← Back</a>
      <h2>Enroll student</h2>
    </div>

    <div class="section-card">
      <p class="section-label">Student details</p>

      <label for="name">Full name</label>
      <input type="text" id="name" placeholder="e.g. Ahmad Faris" />

      <label for="sid">Student ID</label>
      <input type="text" id="sid" placeholder="e.g. 2021234567" />

      <label for="course">Course</label>
      <input type="text" id="course" placeholder="e.g. CS301 — Algorithms" />
    </div>

    <div class="section-card">
      <p class="section-label">Face photo</p>
      <div class="upload-zone">
        <div class="upload-icon">↑</div>
        <div>Click to upload a clear photo</div>
        <div style="font-size: 12px; margin-top: 4px;">JPG or PNG · Face must be visible</div>
      </div>
    </div>

    <a href="dashboard.html" class="btn btn-primary">Enroll student</a>

  </div>

</body>
</html>
